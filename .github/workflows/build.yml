name: Construire Mon Rythme Sleeve V3 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: sleeve-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Tester et compiler Android V3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire le projet V3
        run: |
          unzip -q MonRythmeSleeve-V3-Projet.zip -d "$RUNNER_TEMP/sleeve-v3"
          grep 'versionName = "3.0.0-beta"' "$RUNNER_TEMP/sleeve-v3/app/build.gradle.kts"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Installer les outils Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conserver la signature des mises a jour
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sleeve-v2-stable-debug-signing-v1

      - name: Tester et compiler APK V3
        run: gradle --no-daemon --project-dir "$RUNNER_TEMP/sleeve-v3" :app:testDebugUnitTest :app:assembleDebug

      - name: Conserver les resultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Resultats-tests-V3
          path: ${{ runner.temp }}/sleeve-v3/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Mettre APK V3 a disposition
        uses: actions/upload-artifact@v4
        with:
          name: MonRythmeSleeve-V3-Beta-APK
          path: ${{ runner.temp }}/sleeve-v3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
