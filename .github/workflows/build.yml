
name: Construire Mon Rythme Sleeve V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android-apk:
    name: Compiler APK Android V2
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Installer les outils Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conserver la signature des prochaines mises a jour
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sleeve-v2-stable-debug-signing-v1

      - name: Tester et compiler APK beta
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Mettre APK a disposition
        uses: actions/upload-artifact@v4
        with:
          name: MonRythmeSleeve-V2-Beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

