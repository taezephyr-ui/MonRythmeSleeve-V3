
name: Construire Mon Rythme Sleeve V3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - beta/pipou-3.0.1

jobs:
  android-apk:
    name: Compiler APK Android V3
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Installer les outils Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conserver la signature des prochaines mises a jour
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sleeve-v2-stable-debug-signing-v1

      - name: Tester et compiler APK beta
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :wear:assembleDebug

      - name: Conserver les resultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Resultats-tests-V3
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Verifier la signature et la maison embarquee
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          unzip -p "$apk" assets/pipou.html | cmp - app/src/main/assets/pipou.html

      - name: Verifier la signature de la montre
        shell: bash
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for module in app wear; do
            "$signer" verify --print-certs "$module/build/outputs/apk/debug/$module-debug.apk" | grep 'certificate SHA-256 digest:' > "$module.cert"
          done
          cmp app.cert wear.cert

      - name: Mettre APK montre a disposition
        uses: actions/upload-artifact@v4
        with:
          name: MonRythmeSleeve-Montre-APK
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

      - name: Mettre APK a disposition
        uses: actions/upload-artifact@v4
        with:
          name: MonRythmeSleeve-V3-Beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

